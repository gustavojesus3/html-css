<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
        }

        table{
            border-collapse: collapse;
            width: 600px;
        }

        th, td{
            border: 2px solid black;
            padding: 10px;
        }

        th{
            background-color: rgb(95, 95, 95);
            color: white;
        }

        .oi{
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Tabela 1</h1>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Áreas</th>
                <th scope="col" rowspan="2">Disciplina</th>
                <th scope="colgroup" colspan="2">Notas</th>
                <th scope="col" rowspan="2">Média</th>
            </tr>
            <tr>
                <th scope="col">Notas 1</th>
                <th scope="col">Notas 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" class="oi" rowspan="4">Exastas</th>
                <td>Matemática</td>
                <td>7.0</td>
                <td>8.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>3.0</td>
                <td>9.0</td>
                <td>6.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>3.0</td>
                <td>2.0</td>
                <td>2.5</td>
            </tr>
            <tr>
                <th scope="row" colspan="4">Média de Exastas</th>
                <td>6.0</td>
            </tr>
            <tr>
                <th scope="rowgroup" class="oi" rowspan="2">Humanas</th>
                <td>História</td>
                <td>10.0</td>
                <td>8.0</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>9.0</td>
                <td>8.0</td>
                <td>8.5</td>
            </tr>
            <tr>
                <th scope="row" colspan="4">Média de Humanas</th>
                <td>9.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
