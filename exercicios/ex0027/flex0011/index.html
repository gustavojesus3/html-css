<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;

        }

        div#A{
            flex-shrink: 0;
            flex-grow: 1;
        }

        div#B{
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#C{
            flex-shrink: 8;
            flex-grow: 1;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="A">a</div>
        <div class="item" id="B">b</div>
        <div class="item" id="C">c</div>
    </div>
</body>
</html>
