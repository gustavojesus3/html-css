<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>forms</h1>
    <form action="android.php" method="post">
        <p>
            <label for="icor">cor: <input type="color" name="cor" id="icor" value="#00ff00"></label>

        <p>
            <label for="iniviel">nivel de satisfação</label>
            <input type="range" name="nivel" id="inivel" min="1" max="10" value="3">

        <p>
            <label for="ifoto"></label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
