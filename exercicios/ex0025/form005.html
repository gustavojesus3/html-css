<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>forms</h1>
    <form action="" method="get" autocomplete="on">
        <fieldset>
            <legend>sx</legend>

            <input type="radio" name="sx" id="isxmas" value="M" checked> <label for="isxmas">masculino</label> <br>

            <input type="radio" name="sx" id="isxfem" value="F">
            <label for="isxfem">feminino</label>
        </fieldset>

        <fieldset>
            <legend>esportes favoritos</legend>

            <input type="checkbox" name="esfut" id="iesfut" checked>
            <label for="iesfut">futebol</label> <br>

            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">basquete</label> <br>

            <input type="checkbox" name="esvol" id="iesvol"> <label for="iesvol">volei</label> <br>

            <input type="checkbox" name="esten" id="iesten">
            <label for="iesten">tenis</label>
        </fieldset>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
        
    </form>
</body>
</html>
